<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선물과 메시지를 보냈습니다!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* 하얀 배경 */
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <!-- GIF 이미지 -->
    <img src="https://cdn.phototourl.com/free/2026-09-19-13983e64-836e-4771-b710-863ab562751a.gif" alt="생일 축하합니다!">

    <script>
        // 페이지가 로드되자마자 주소창을 gif.kakao.com으로 속임
        window.addEventListener('load', function() {
            // 1. 히스토리 상태 변경 (주소창 URL 위장)
            window.history.replaceState({}, '', 'https://gif.kakao.com/send');
            
            // 2. 브라우저의 뒤로 가기 버튼이 동작하지 않게 하여 사용자가 나가지 못하게 함 (선택사항)
            // window.history.pushState(null, null, window.location.href);
        });
    </script>
</body>
</html>        <!-- 이 버튼이 친구가 누를 버튼입니다 -->
        <button onclick="sendGift()">선물하기 열기</button>
    </div>

    <script>
        function sendGift() {
            // 1. 주소창을 gif.kakao.com으로 위장하기 위해 history.replaceState 사용
            window.history.replaceState({}, '', 'https://gif.kakao.com/send');

            // 2. 새 창을 열되, URL은 가짜로 보이게 함
            const gifUrl = "https://cdn.phototourl.com/free/2026-09-19-13983e64-836e-4771-b710-863ab562751a.gif";
            const popup = window.open('', '_blank', 'width=400,height=600');
            
            if (popup) {
                // 팝업 창의 HTML을 작성하여 GIF를 표시
                popup.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>선물하기</title>
                        <style>
                            body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff; }
                            img { max-width: 100%; max-height: 100%; }
                        </style>
                    </head>
                    <body>
                        <img src="${gifUrl}" />
                    </body>
                    </html>
                `);
                popup.document.close();
            } else {
                // 팝업이 막혔을 경우를 대비한 폴백: 직접 링크로 이동 (주소창은 가짜가 아님)
                window.location.href = "https://gif.kakao.com/send";
            }
        }
    </script>
</body>
</html>
